name: envoy

x-envoy-service: &envoy-service
  image: envoy:production
  env_file:
    - .env.production
  init: true
  networks:
    - envoy-network
  security_opt:
    - no-new-privileges:true

services:
  web:
    <<: *envoy-service
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "node", "server.js" ]
    ports:
      - "6178:6178"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6178/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *envoy-service
    command: [ "node", "node_modules/tsx/dist/cli.mjs", "src/worker/index.ts" ]
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    <<: *envoy-service
    command: [ "node", "node_modules/tsx/dist/cli.mjs", "scripts/migrate.ts" ]
    restart: "no"

networks:
  envoy-network:
    name: envoy-network
    driver: bridge
