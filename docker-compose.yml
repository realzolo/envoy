services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: envoy
      POSTGRES_USER: envoy
      POSTGRES_PASSWORD: envoy
    ports:
      - "5432:5432"
    volumes:
      - envoy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U envoy -d envoy" ]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - envoy_redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  envoy_postgres:
  envoy_redis:
